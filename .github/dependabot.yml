# Keeps the dependency tree current.
#
# The repo carries a large dep tree for a project this size, and stale
# transitive deps are where supply-chain surprises come from. Grouped so a
# weekly run opens one PR for runtime deps and one for tooling, instead of a
# dozen.

version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    # TypeScript majors are deliberate, not routine. A new compiler major can
    # pass `tsc` and still change emit, lib types, or inference in ways the
    # test suite never notices -- and this project has no runtime type checking
    # to catch it. Minor and patch updates still arrive automatically.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Ship-blockers and framework: bump and verify individually, since these
      # touch React and the build itself.
      runtime-critical:
        patterns:
          - 'react'
          - 'react-dom'
          - 'zustand'
          - 'break_infinity.js'
      # Everything else moves together; the gate is `npm run verify`.
      tooling:
        patterns:
          - '*'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
    ignore:
      # Third-party actions pinned to a SHA must not be bumped automatically:
      # the release workflow is the only step holding contents: write, so a
      # repoint has to be reviewed rather than merged blind. Major bumps of the
      # first-party actions are fine -- they are versioned with the runner.
      - dependency-name: softprops/action-gh-release
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'
