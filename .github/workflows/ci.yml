# CI — the gate. Nothing deploys without this passing.
#
# Runs the same `npm run verify` you run locally: typecheck, tests, build.
# Deliberately mirrors CONTRIBUTING.md so a green run locally means a green
# run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch: a new push makes the previous
# result irrelevant, and idle games get pushed in bursts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      # Balance guard: reports the measured pacing on every push so a regression
      # shows up in the log rather than waiting for someone to notice.
      - name: Balance simulation
        run: npm run simulate -- --hours 2
