# Verify, release, and deploy.
#
# Unified pipeline that enforces:
#   1. verify: Lint, typecheck, workflow check, build, tests, and balance pacing simulation.
#   2. release:
#      - If maintainer (MaskirovkaOtdel) pushes to dev: calculates SemVer bump,
#        synchronizes package.json and package-lock.json, fast-forwards main,
#        creates annotated tag and GitHub release, and syncs dev.
#   3. contributor-pr:
#      - If non-maintainer pushes to secondary branch: ensures an open PR exists
#        targeting dev for maintainer review.
#   4. deploy:
#      - Publishes production build to GitHub Pages atomically from main.

name: Verify and deploy

on:
  push:
    branches: [main, dev, 'contrib/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full gate: lint, typecheck, workflow YAML check, test, build.
      - name: Lint, typecheck, test, build
        run: npm run verify

      # Economy pacing gate: 12h simulation horizon.
      - name: Balance simulation
        run: npm run simulate -- --hours 12 --check

  release:
    name: Auto release and sync
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.actor == 'MaskirovkaOtdel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Evaluate SemVer Bump
        id: semver
        run: |
          set -euo pipefail
          npx tsx tools/semver-engine.ts --apply

      - name: Commit version bump
        if: steps.semver.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "MaskirovkaOtdel"
          git config user.email "thod.efstathiadis@gmail.com"
          git commit -s -a -m "chore(release): bump version to ${{ steps.semver.outputs.tag }}"

      - name: Merge to main and sync dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
          SHOULD_RELEASE: ${{ steps.semver.outputs.should_release }}
          NOTES: ${{ steps.semver.outputs.release_notes }}
        run: |
          set -euo pipefail
          git config user.name "MaskirovkaOtdel"
          git config user.email "thod.efstathiadis@gmail.com"

          # Fast-forward main with the verified commit(s)
          git push origin HEAD:refs/heads/main

          # If a release was cut, tag and publish GitHub release
          if [ "$SHOULD_RELEASE" = "true" ]; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes "${NOTES}"
          fi

          # Fast-forward dev to keep branches synchronized at the exact same SHA
          git push origin HEAD:refs/heads/dev

  contributor-pr:
    name: Contributor PR triage
    needs: verify
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.actor != 'MaskirovkaOtdel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PR exists for maintainer review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PR_COUNT=$(gh pr list --head "${BRANCH}" --base dev --state open --json number -q '. | length')
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No open PR found for ${BRANCH}. Creating pull request for maintainer review..."
            gh pr create \
              --base dev \
              --head "${BRANCH}" \
              --title "contribute: ${BRANCH} by @${{ github.actor }}" \
              --body "### Contributor Submission

          This PR was automatically created because contributor @${{ github.actor }} pushed to branch \`${BRANCH}\`.

          - [x] Automated CI verification checks have passed on this commit.
          - [x] Balance pacing simulations have passed.

          Awaiting review from maintainer @MaskirovkaOtdel before merging into \`main\`." \
              --reviewer MaskirovkaOtdel
          else
            echo "Open PR already exists for branch ${BRANCH}."
          fi

  sync-dev:
    name: Sync dev with main
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward dev to main
        run: |
          set -euo pipefail
          git config user.name "MaskirovkaOtdel"
          git config user.email "thod.efstathiadis@gmail.com"
          git push origin HEAD:refs/heads/dev

  deploy:
    name: Deploy to Pages
    needs: [verify, release]
    if: always() && needs.verify.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/dev' && github.actor == 'MaskirovkaOtdel'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      # Pages source must be set to "GitHub Actions" in Settings > Pages.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
