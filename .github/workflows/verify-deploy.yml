# Verify and deploy.
#
# One workflow, one status. Previously CI and Deploy were separate, so a push
# produced two checks that could disagree — and the deploy check failed three
# times for a Pages-configuration reason that said nothing about code quality.
# Merging them means a single check means "this commit is good and live".
#
# Flow:
#   1. verify  — typecheck, test, build, balance simulation
#   2. deploy  — only on main, only after verify passes, published atomically
#
# The deploy gate matters: auto-deploying without one ships a broken commit to
# players the moment it is pushed.

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref. Safe here because the deploy half uses
# `cancel-in-progress: false` at its own concurrency group, so a queued publish
# still collapses to the newest commit rather than racing mid-swap.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full gate, matching what contributors run locally: lint, typecheck,
      # workflow YAML check, test, build. Lint leads because a warning there is
      # the cheapest signal to act on, and it fails in seconds.
      - name: Lint, typecheck, test, build
        run: npm run verify

      # Reports measured pacing on every run, so an economy regression shows up
      # in the log instead of waiting for someone to notice.
      - name: Balance simulation
        run: npm run simulate -- --hours 2

  deploy:
    name: Deploy to Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Never cancel a publish mid-swap; queued commits collapse to the latest.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      # Pages source must be set to "GitHub Actions" in Settings > Pages. Setting
      # it to "Deploy from a branch" publishes the repository root instead, which
      # serves the dev index.html and a blank page.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Atomic swap: visitors see the old build or the new one, never a partial
      # deploy.
      - id: deployment
        uses: actions/deploy-pages@v5
