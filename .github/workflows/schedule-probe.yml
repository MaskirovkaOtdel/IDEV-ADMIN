name: Schedule probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: cron probe
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "probe fired: event=${{ github.event_name }} at $(date -u +%FT%TZ)"