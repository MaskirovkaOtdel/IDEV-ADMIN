# Release — publishes a GitHub Release for a version tag.
#
# Main deploys continuously; tags mark Early Access milestones. So the tag is
# the thing that gets named, and it also records which commit the milestone was
# cut from.
#
# Usage:
#   git tag -a v0.1.0 -m "Early Access 0.1.0"
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the changelog can list every commit in the range.
          fetch-depth: 0
          fetch-tags: true

      # Verifies the tag parses as a version and the tree actually builds, so a
      # release can never point at a commit that does not pass CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
'